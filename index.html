<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245edb">
  <title>ArchiveXP Professional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-brand"><div class="boot-mark"><span></span><span></span><span></span><span></span></div><div><strong>ArchiveXP</strong><small>Professional</small></div></div>
    <div class="boot-loading"><div class="boot-track"><i></i><i></i><i></i></div><p>Starting ArchiveXP...</p></div>
    <div class="boot-footer">A personal computing experience</div>
  </div>

  <main id="desktop" class="desktop hidden" aria-label="ArchiveXP desktop">
    <div class="desktop-wallpaper"></div>
    <div class="desktop-icons" id="desktopIcons">
      <button class="desktop-icon" data-open="computer"><span class="desk-icon computer-icon"><i></i></span><span>My Computer</span></button>
      <button class="desktop-icon" data-open="archive"><span class="desk-icon archive-icon"><i></i></span><span>Archive Explorer</span></button>
      <button class="desktop-icon" data-open="internet"><span class="desk-icon internet-icon">e</span><span>Internet</span></button>
      <button class="desktop-icon" data-open="documents"><span class="desk-icon folder-icon"></span><span>My Documents</span></button>
      <button class="desktop-icon" data-open="recycle"><span class="desk-icon recycle-icon">♲</span><span>Recycle Bin</span></button>
    </div>
    <div id="windows" class="windows-layer"></div>
    <div id="startMenu" class="start-menu hidden">
      <div class="start-user"><div class="user-avatar">A</div><strong id="startUserName">Administrator</strong><span>ArchiveXP Professional</span></div>
      <div class="start-columns">
        <div class="start-left">
          <button data-open="internet"><span class="start-app-icon ie-small">e</span><span><b>Internet</b><small>Browse the web</small></span></button>
          <button data-open="email"><span class="start-app-icon mail-small">✉</span><span><b>E-mail</b><small>Local mail demo</small></span></button>
          <div class="start-separator"></div>
          <button data-open="archive"><span class="start-app-icon archive-small">▣</span><span><b>Archive Explorer</b><small>Browse archived software</small></span></button>
          <button data-open="computer"><span class="start-app-icon pc-small">▰</span><span><b>My Computer</b><small>Files and drives</small></span></button>
          <button data-open="control"><span class="start-app-icon control-small">⚙</span><span><b>Control Panel</b></span></button>
          <button data-open="paint"><span class="start-app-icon paint-small">▧</span><span><b>Paint</b></span></button>
          <button data-open="notepad"><span class="start-app-icon note-small">▤</span><span><b>Notepad</b></span></button>
          <button data-open="calculator"><span class="start-app-icon calc-small">▦</span><span><b>Calculator</b></span></button>
        </div>
        <div class="start-right">
          <button data-open="documents"><b>My Documents</b></button>
          <button data-open="computer"><b>My Computer</b></button>
          <button data-open="control"><b>Control Panel</b></button>
          <button data-open="system"><b>System Information</b></button>
          <div class="start-separator"></div>
          <button data-open="help"><b>Help and Support</b></button>
          <button data-open="search"><b>Search</b></button>
          <button data-open="run"><b>Run...</b></button>
        </div>
      </div>
      <div class="start-bottom"><button id="logoffBtn">↪ Log Off</button><button id="shutdownBtn">⏻ Turn Off Computer</button></div>
    </div>
    <div id="contextMenu" class="context-menu hidden">
      <button data-context="refresh">Refresh</button><button data-context="newfolder">New Folder</button><button data-context="properties">Properties</button>
    </div>
    <div class="taskbar">
      <button id="startButton" class="start-button"><span class="start-orb">✿</span><b>start</b></button>
      <div id="taskButtons" class="task-buttons"></div>
      <div class="task-tray"><span class="tray-status">◈</span><span class="tray-volume" title="Volume">🔊</span><span id="clock">10:30 PM</span></div>
    </div>
  </main>

  <div id="welcome" class="welcome-overlay hidden">
    <div class="welcome-card"><div class="welcome-logo"><div class="boot-mark"><span></span><span></span><span></span><span></span></div><b>ArchiveXP</b></div><h1>Welcome</h1><p>Your desktop is ready.</p><button id="welcomeOk" class="xp-button">Start using ArchiveXP</button></div>
  </div>

  <div id="shutdownScreen" class="shutdown-screen hidden"><div class="shutdown-logo">ArchiveXP</div><h2 id="shutdownText">Logging off...</h2><div class="shutdown-bar"><i></i></div></div>
  <script src="script.js"></script>
</body>
</html>
